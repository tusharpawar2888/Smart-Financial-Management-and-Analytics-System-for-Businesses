{% extends 'base_auth.html' %}{% block title %}Log in | Business Finance Desk{% endblock %}{% block body %}
<main class="auth-wrap"><section class="auth-card"><p class="section-kicker">WELCOME BACK</p><h1>Log in to your workspace</h1><p class="lead">Use your registered email and password to continue.</p><form class="auth-form" method="post"><label>Email address<input type="email" name="email" autocomplete="username" placeholder="you@company.com" required></label><label>Password<input type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required></label><button class="button primary" type="submit">Log in</button></form><p class="auth-foot">New here? <a href="{{ url_for('signup') }}">Create a client account</a></p></section></main>{% endblock %}
