{% extends 'base_auth.html' %}{% block title %}Create account | Business Finance Desk{% endblock %}{% block body %}
<main class="auth-wrap"><section class="auth-card"><p class="section-kicker">GET STARTED</p><h1>Create your workspace</h1><p class="lead">Just the essentials. You can start using the finance dashboard after signup.</p><form class="auth-form" method="post"><label>Company name<input type="text" name="company_name" maxlength="120" placeholder="Your business name" required></label><label>Email address<input type="email" name="email" autocomplete="email" maxlength="254" placeholder="you@company.com" required></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required></label><button class="button primary" type="submit">Create account</button></form><p class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></section></main>{% endblock %}
